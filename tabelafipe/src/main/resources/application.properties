spring.application.name=tabelafipe
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}/${DB_NAMEFIPE}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
hibernate.dialect=spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
